{% load static %}
{% load compress %}
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#061009">
    <link rel="icon" href="{% static 'img/favicon.ico' %}" sizes="any">
    <link rel="icon" type="image/png" href="{% static 'img/logofav.png' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    {% compress css %}<link rel="stylesheet" href="{% static 'css/auth.css' %}">{% endcompress %}
    <title>{% block title %}Account{% endblock %} | FLECTA</title>
</head>
<body>
<main class="auth-shell">
    <div class="auth-grid" aria-hidden="true"></div>
    <div class="auth-glow glow-one" aria-hidden="true"></div>
    <div class="auth-glow glow-two" aria-hidden="true"></div>
    <section class="auth-layout">
        <div class="auth-card-wrap">
            <div class="auth-card"><div class="auth-card-shine" aria-hidden="true"></div>{% block card_content %}{% endblock %}</div>
        </div>
    </section>
</main>
</body>
</html>
