{% load humanize %}
{% for post in posts %}
    <div class="sidebar-latest-post">
        <div class="sidebar-latest-thumb">
            {% if post.image %}
                <img src="{{ post.image.url }}" alt="{{ post.title }}">
            {% else %}
                <span>MQL</span>
            {% endif %}
        </div>
        <div>
            <h3><a href="{% url 'blog:single' pid=post.id %}">{{ post.title }}</a></h3>
            <time>{{ post.published_date|date:"M d, Y" }}</time>
        </div>
    </div>
{% endfor %}
