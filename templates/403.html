<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Access Denied | FLECTA</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:#0b0f14;color:#e8eef5;
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  .card{width:min(680px,92vw);padding:48px 40px;border:1px solid #1e2833;border-radius:20px;
    background:#111820;text-align:center}
  .code{display:block;font-size:72px;font-weight:800;line-height:1;color:#2f81f7;letter-spacing:-2px}
  .label{margin:12px 0 4px;text-transform:uppercase;letter-spacing:.18em;font-size:12px;color:#8aa0b6}
  h1{margin:8px 0 16px;font-size:28px;line-height:1.3}
  p{margin:0 0 28px;color:#a9bacb;line-height:1.7}
  .actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  a{display:inline-block;padding:12px 22px;border-radius:10px;text-decoration:none;font-weight:600;font-size:14px}
  .primary{background:#2f81f7;color:#fff}
  .secondary{border:1px solid #2a3947;color:#c8d6e5}
</style>
</head>
<body>
  <main class="card">
    <span class="code" aria-hidden="true">403</span>
    <p class="label">Access denied</p>
    <h1>You don't have permission to view this page.</h1>
    <p>If you believe this is a mistake, please contact us and we will help you out.</p>
    <div class="actions">
      <a class="primary" href="/">Back to Home</a>
      <a class="secondary" href="/contact/">Contact Us</a>
    </div>
  </main>
</body>
</html>
